<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTRADER Dashboard</title><style>:root{--gold:#f5c542;--gold2:#ffd966;--goldD:#b88400;--navy:#0a1530;--navy2:#0f2a5c;--ink:#14213d;--ink2:#34466b;--ink3:#5a6b8c;--line:rgba(15,42,92,.14);--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--card:#ffffff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;color-scheme:light}
body{margin:0;background:#e8f2fb;color:var(--ink);font-family:'Noto Sans Thai','Sarabun','Leelawadee UI','Tahoma','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.65;min-height:100vh}
.banner{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#14316b 0%,#0d2150 55%,#0a1530 100%);border-bottom:3px solid var(--gold);padding:14px 28px 0;box-shadow:0 6px 20px rgba(10,21,48,.35)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--gold2),#d99a00);color:#0a1530;font-weight:800;font-size:19px;letter-spacing:1px}
.bt{font-size:26px;font-weight:800;color:var(--gold);letter-spacing:3px;line-height:1.1}
.bs{font-size:13px;color:#c3cfee}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{appearance:none;border:1px solid transparent;border-bottom:0;background:rgba(255,255,255,.08);color:#d5def5;padding:9px 18px;border-radius:10px 10px 0 0;font:inherit;font-weight:600;cursor:pointer}
.tabs button:hover{background:rgba(255,255,255,.16)}
.tabs button.on{background:var(--gold);color:#0a1530}
main{max-width:1280px;margin:0 auto;padding:24px 22px 40px}
body[data-tab="gold"] [data-tab]:not([data-tab="gold"]),body[data-tab="setups"] [data-tab]:not([data-tab="setups"]),body[data-tab="lessons"] [data-tab]:not([data-tab="lessons"]){display:none!important}
.pagetitle{margin:0 0 6px;font-size:28px;color:var(--navy2);font-weight:800;border-bottom:4px solid var(--gold);display:inline-block;padding-bottom:2px}
.summary{color:var(--ink2);margin:8px 0 18px;max-width:980px}
.section{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--navy2);border-radius:14px;padding:18px 20px;margin:18px 0;box-shadow:0 2px 10px rgba(15,42,92,.08)}
.section.d1{background:#f4f9fe;border:1px solid var(--line);border-top:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0;box-shadow:none}
.section.d2{background:transparent;padding:8px 0 8px 12px;border:0;border-left:3px solid var(--gold);border-radius:0;box-shadow:none;margin:10px 0}
.sh{margin:0 0 10px;color:var(--navy2);font-weight:700}
.sh0{font-size:21px;padding-left:12px;border-left:6px solid var(--gold)}
.sh1{font-size:17px;color:#1d4585}.sh2{font-size:15px;color:#2c4f8f}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary .sh::before{content:"▸ ";color:var(--goldD)}details[open]>summary .sh::before{content:"▾ "}
.caption{color:var(--ink3);font-size:13px;margin:-4px 0 10px}
.sbody{display:flex;flex-direction:column;gap:12px}
.text{margin:0}
.callout{border-radius:10px;padding:12px 16px;border:1px solid #b9d3f2;border-left:6px solid #2f6fd0;background:#eaf3ff;color:var(--ink)}
.callout .lead{color:#1d4585}
.callout.t-warning{background:#fff6dc;border-color:#f0d58a;border-left-color:#d99a00}.callout.t-warning .lead{color:#8a5a00}
.callout.t-danger{background:#ffeaea;border-color:#f3b3b3;border-left-color:#dc2626}.callout.t-danger .lead{color:var(--bad)}
.callout.t-success{background:#e6f7ec;border-color:#a8dcb9;border-left-color:#16a34a}.callout.t-success .lead{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.banner{padding:12px 14px 0}}
@media(max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:linear-gradient(180deg,#17376f,#0f2a5c);color:var(--gold2);text-align:left;padding:10px 12px;font-weight:700;white-space:nowrap;border-bottom:3px solid var(--gold)}
td{padding:9px 12px;border-top:1px solid rgba(15,42,92,.09);vertical-align:top;color:var(--ink)}
tbody tr:nth-child(even) td{background:#f4f9fe}
tbody tr:hover td{background:#fff4d1}
td.end,th.end{text-align:right}
td.tone-success{color:#116a33;background:#dcf5e5!important;font-weight:600}
td.tone-danger{color:#a31515;background:#fde3e3!important;font-weight:600}
td.tone-warning{color:#8a4a06;background:#fdf0cf!important;font-weight:600}
.props{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:0;margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.props dt{background:#fff4d1;color:#6b4b00;padding:8px 12px;font-weight:600;border-top:1px solid var(--line)}
.props dd{margin:0;padding:8px 12px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.props dt:first-of-type,.props dd:first-of-type{border-top:0}
@media(max-width:620px){.props{grid-template-columns:1fr}}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:16px 0}
.metric{border-radius:14px;padding:16px 18px;border:1px solid #b9d3f2;background:#fff;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(15,42,92,.08)}
.metric::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(180deg,var(--gold),#d99a00)}
.mlabel{font-size:13px;color:var(--ink2);font-weight:600}.mvalue{font-size:32px;font-weight:800;color:var(--navy2);line-height:1.15;margin:4px 0}.mdetail{font-size:12.5px;color:var(--ink3)}
.m-success{background:#e6f7ec;border-color:#7fcf9c}.m-success::before{background:#16a34a}.m-success .mvalue{color:#116a33}
.m-danger{background:#fdeaea;border-color:#ee9a9a}.m-danger::before{background:#dc2626}.m-danger .mvalue{color:#a31515}
.m-warning{background:#fff4d9;border-color:#efc66a}.m-warning::before{background:#e69a00}.m-warning .mvalue{color:#8a4a06}
.status{display:inline-block;padding:2px 12px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid transparent;line-height:1.6}
.s-success{background:#dcf5e5;color:#116a33;border-color:#7fcf9c}
.s-danger{background:#fde3e3;color:#a31515;border-color:#ee9a9a}
.s-warning{background:#fdf0cf;color:#8a4a06;border-color:#efc66a}
.s-accent{background:#fff1c2;color:#6b4b00;border-color:#e6c14d}
.s-neutral{background:#e6edf8;color:var(--ink2);border-color:#c5d3ea}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.rtitle{font-weight:600}.rdetail{font-size:13px;color:var(--ink3)}.rmeta{color:var(--ink3);font-size:13px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);font-weight:600}
.field input,.field select{background:#fff;color:var(--ink);border:1px solid #9db4d8;border-radius:8px;padding:8px 10px;font:inherit;font-weight:400;width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--navy2);border-color:var(--navy2)}
.toggle{display:flex;align-items:center;gap:10px;color:var(--ink2);font-weight:600;font-size:13px;cursor:pointer;padding-top:18px}
.toggle input{position:absolute;opacity:0}.toggle i{width:40px;height:22px;border-radius:99px;background:#a9b9d6;position:relative;flex:none;transition:.15s}
.toggle i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle input:checked+i{background:#d99a00}.toggle input:checked+i::after{left:21px}
.toggle input:focus-visible+i{outline:2px solid var(--navy2)}
.btn{appearance:none;border:1px solid #9db4d8;background:#fff;color:var(--navy2);padding:8px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;align-self:flex-start;margin-top:auto}
.btn:hover{background:#eaf3ff}.btn.primary{background:var(--gold);color:#0a1530;border-color:#d99a00}.btn.primary:hover{background:var(--gold2)}
.seg{display:inline-flex;border:1px solid #9db4d8;border-radius:10px;overflow:hidden;align-self:flex-start;flex-wrap:wrap;background:#fff}
.seg button{appearance:none;border:0;background:transparent;color:var(--navy2);padding:7px 16px;font:inherit;font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid #c5d3ea}.seg button:hover{background:#eaf3ff}.seg button.on{background:var(--navy2);color:var(--gold2)}.seg em{font-style:normal;opacity:.7;margin-left:6px}
.list ul,.list ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}.list li::marker{color:var(--goldD);font-weight:700}
.list ul ul,.list ol ul,.list ul ol,.list ol ol{margin-top:6px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;position:relative;padding:8px 12px 8px 52px;background:#f4f9fe;border-radius:10px;border:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:12px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--navy2);color:var(--gold2);font-weight:800;display:grid;place-items:center}
.steps b{color:var(--navy2)}.sdetail{color:var(--ink2);font-size:14px}
.quote{margin:0;padding:10px 18px;border-left:5px solid var(--gold);background:#fff6dc;border-radius:0 10px 10px 0;font-style:italic;color:#4a3600}.quote cite{display:block;font-size:13px;color:var(--ink3);font-style:normal;margin-top:4px}
.toc{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;padding:12px 16px;margin:0 0 6px}
.toctitle{color:var(--navy2);font-weight:700;margin-bottom:6px}.toclinks{display:flex;flex-wrap:wrap;gap:8px}
.toclinks a{color:var(--navy2);text-decoration:none;background:#e6f0ff;border:1px solid #b9d3f2;padding:3px 12px;border-radius:99px;font-size:13px}
.toclinks a:hover{background:var(--navy2);color:var(--gold2);border-color:var(--navy2)}
.linkcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.linkcards a{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;color:var(--ink);text-decoration:none}
.linkcards a:hover{border-color:var(--navy2);background:#f4f9fe}.linkcards b{color:var(--navy2)}.linkcards span{font-size:12.5px;color:var(--ink3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.diagram{display:flex;flex-direction:column;align-items:center;gap:6px}.drow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.darrow{color:var(--goldD)}
.dnode{background:#e6f0ff;border:1px solid #8fb2e6;border-radius:10px;padding:10px 16px;max-width:360px;text-align:center;color:var(--navy2);font-weight:600}
.dnode.term{background:#fff1c2;border-color:#d99a00;color:#4a3600;font-weight:700}
.equation{text-align:center;font-size:18px;padding:10px;background:#f4f9fe;border:1px solid var(--line);border-radius:10px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;font-size:.9em}.frac span:first-child{border-bottom:1px solid var(--ink);padding:0 6px}
.foot{max-width:1280px;margin:0 auto;padding:20px 22px 40px;color:var(--ink3);font-size:12.5px;text-align:center;border-top:1px solid var(--line)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
svg text{font-family:inherit}
